services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_portal}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge_portal_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_portal} -d ${POSTGRES_DB:-knowledge_portal}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
